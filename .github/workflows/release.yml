name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'content/docs/**'
      - 'public/hero-dither-cover.png'
      - 'scripts/build-epub.mjs'
      - 'scripts/cover.mjs'
      - 'scripts/epub/**'
      - 'src/lib/shared.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

# Two merges landing a minute apart would otherwise race to publish, and the loser could
# overwrite the winner's asset.
concurrency:
  group: edition
  cancel-in-progress: true

jobs:
  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: bun install --frozen-lockfile

      - run: bun run build:epub

      # Guards against a build that walked no chapters: the package would still be a valid
      # epub, and epubcheck would pass it.
      - name: Check the book is not empty
        run: |
          size="$(stat -c%s dist/agents-honestly.epub)"
          echo "epub is $size bytes"
          [ "$size" -gt 500000 ]

      - name: Validate with epubcheck
        run: |
          curl -sSLo epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.2.1/epubcheck.jar dist/agents-honestly.epub

      # The site links the book at /releases/latest/download, so the edition is one release
      # that keeps its name and follows main, rather than one release per merge. The tag is a
      # moving pointer for the same reason, so the release page shows the commit it was built
      # from. A branch filter cannot match a tag push, so this does not retrigger the job.
      - name: Move the edition tag to this commit
        run: |
          git tag --force edition
          git push --force origin refs/tags/edition

      - id: built
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: edition
          name: The current edition
          body: |
            The book as it stands on `main`.

            Built ${{ steps.built.outputs.date }} from ${{ github.sha }}.
          files: dist/agents-honestly.epub
          make_latest: true
